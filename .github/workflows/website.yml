name: Website bijwerken

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # elk uur, haalt de uitslagen uit het Google Sheet
  workflow_dispatch:        # handmatig starten via de knop "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Website bouwen
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
